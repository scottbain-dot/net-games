<script>
(function () {
'use strict';

// ═══════════════════════ utils ═══════════════════════
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const $ = (sel, root) => (root || document).querySelector(sel);
const PALETTE = [
  ['#d4f0e4', '#0a5c35'], ['#e8e4ff', '#4a3a9a'], ['#ddeeff', '#1a4a7a'], ['#ffe4d4', '#7a2a0a'],
  ['#fff0d4', '#7a5a0a'], ['#fde4ee', '#8a2a5a'], ['#d4eeff', '#0a4a7a'], ['#e4ffd4', '#2a6a0a']
];
function initials(name) { const p = String(name).trim().split(/\s+/); return (((p[0] || '')[0] || '') + ((p[1] || '')[0] || '')).toUpperCase(); }
function hashIdx(name) { let h = 0; for (const ch of String(name)) h = (h * 31 + ch.charCodeAt(0)) >>> 0; return h % PALETTE.length; }
function avatar(name) { const c = PALETTE[hashIdx(name)]; return `<span class="avatar" style="background:${c[0]};color:${c[1]}">${esc(initials(name))}</span>`; }
const fmt = (v, d = 1) => (v === null || v === undefined || v === '' || isNaN(v)) ? '—' : Number(v).toFixed(d).replace(/\.0+$/, '');
const num = v => { if (v === '' || v === null || v === undefined) return null; const n = parseFloat(v); return isNaN(n) ? null : n; };
function toast(msg) { const t = $('#toast'); t.textContent = msg; t.classList.add('show'); clearTimeout(toast.t); toast.t = setTimeout(() => t.classList.remove('show'), 2200); }
function banner(kind, html) { const b = $('#banner'); if (!html) { b.className = 'banner'; b.innerHTML = ''; return; } b.className = 'banner show ' + kind; b.innerHTML = html; }

// ═══════════════════════ server bridge ═══════════════════════
function rawCall(fn, ...args) {
  return new Promise((resolve, reject) => {
    if (!window.google || !google.script || !google.script.run) return reject(new Error('Not running inside the Apps Script web app'));
    google.script.run.withSuccessHandler(resolve).withFailureHandler(e => reject(new Error(e && e.message ? e.message : String(e))))[fn](...args);
  });
}
// Apps Script serialises writes and caps simultaneous runs, so a whole class
// saving at once produces "Busy", "too many simultaneous" or timeout errors
// that clear on their own. Transient failures retry with backoff and jitter.
const PERMANENT = /Teachers only|not on roster|Unknown checkpoint|Missing|not signed in/i;
const sleep = ms => new Promise(r => setTimeout(r, ms));
async function call(fn, ...args) {
  let delay = (window.__preview && window.__preview.fastRetry) ? 40 : 1500;
  for (let attempt = 0; ; attempt++) {
    try { return await rawCall(fn, ...args); }
    catch (e) {
      if (PERMANENT.test(e.message) || attempt >= 5) throw e;
      await sleep(delay + Math.random() * delay); delay = Math.min(delay * 2, 20000);
    }
  }
}

// ═══════════════════════ outbox ═══════════════════════
// Every write goes through here and is kept in localStorage (tagged with the
// login that created it) until the server confirms, so a wifi drop or reload
// never loses work.
const OUTBOX_KEY = 'mfs_outbox_v1';
const Outbox = {
  items: [], draining: false, failed: false, lastError: '', waiters: {},
  load() { try { this.items = JSON.parse(localStorage.getItem(OUTBOX_KEY) || '[]'); } catch (e) { this.items = []; } },
  persist() { try { localStorage.setItem(OUTBOX_KEY, JSON.stringify(this.items)); } catch (e) {} },
  mine() { return this.items.filter(i => i.owner === S.id.email); },
  add(fn, payload, label) {
    const id = String(Date.now()) + Math.random().toString(36).slice(2, 7);
    this.items.push({ id, fn, payload, label, owner: S.id.email, ts: Date.now() });
    this.persist();
    const p = new Promise((res, rej) => { this.waiters[id] = { res, rej }; });
    this.drain(); updateSaveState();
    return p;
  },
  async drain() {
    if (this.draining) return;
    this.draining = true;
    let item, sentOrphan = false;
    while ((item = this.mine()[0])) {
      try {
        await call(item.fn, item.payload);
        this.items = this.items.filter(i => i.id !== item.id); this.persist(); this.failed = false;
        if (this.waiters[item.id]) { this.waiters[item.id].res(); delete this.waiters[item.id]; } else sentOrphan = true;
      } catch (e) {
        this.lastError = e.message;
        if (PERMANENT.test(e.message)) {
          this.items = this.items.filter(i => i.id !== item.id); this.persist();
          if (this.waiters[item.id]) { this.waiters[item.id].rej(e); delete this.waiters[item.id]; }
          continue;
        }
        // Still failing after call()'s own retries: keep it, show the banner, and try again later.
        this.failed = true;
        clearTimeout(this.retryTimer); this.retryTimer = setTimeout(() => this.retry(), 30000 + Math.random() * 15000);
        break;
      }
      updateSaveState();
    }
    this.draining = false; updateSaveState();
    if (sentOrphan) refreshAfterOutbox();
  },
  retry() { clearTimeout(this.retryTimer); this.failed = false; updateSaveState(); this.drain(); }
};
async function refreshAfterOutbox() {
  try {
    if (studentMode()) { S.me = await call('getStudent', S.me.section, S.me.student); if (S.view === 'dash') render(); toast('Earlier changes sent ✓'); }
    else if (S.T.section) { S.T.data = await call('getSectionData', S.T.section); S.T.overview = null; if (['register', 'checkins', 'students'].indexOf(S.T.tab) !== -1) render(); toast('Earlier changes sent ✓'); }
  } catch (e) {}
}
// Coalesces rapid teacher taps into one request per (section, checkpoint/lesson).
// `scores` and `agility` sub-objects are merged rather than replaced.
const Pending = {
  map: {}, timer: null,
  put(key, fn, base, entryKey, entry) {
    const p = this.map[key] || (this.map[key] = { fn, base, entries: {} });
    const cur = p.entries[entryKey] || (p.entries[entryKey] = {});
    Object.keys(entry).forEach(k => {
      if (k === 'scores' && entry[k] && typeof entry[k] === 'object') cur[k] = Object.assign(cur[k] || {}, entry[k]);
      else cur[k] = entry[k];
    });
    clearTimeout(this.timer); this.timer = setTimeout(() => this.flush(), 900); updateSaveState();
  },
  count() { return Object.keys(this.map).length; },
  flush() {
    clearTimeout(this.timer);
    const m = this.map; this.map = {};
    Object.keys(m).forEach(key => { const p = m[key]; Outbox.add(p.fn, Object.assign({}, p.base, { entries: Object.values(p.entries) }), key).catch(() => {}); });
  }
};
window.addEventListener('beforeunload', () => Pending.flush());
function updateSaveState() {
  const el = $('#savestate'); if (!el) return;
  const n = Outbox.mine().length + Pending.count();
  if (Outbox.failed) { el.className = 'savestate failed'; el.innerHTML = `${n} change${n === 1 ? '' : 's'} not saved · <a href="#" data-act="retry">retry</a>`; }
  else if (n > 0) { el.className = 'savestate pending'; el.textContent = 'Saving…'; }
  else { el.className = 'savestate'; el.textContent = 'All saved ✓'; }
  if (Outbox.failed) banner('warn', `Busy server — your work is saved on this device and will be sent automatically. You can carry on. <span class="tiny">${esc(Outbox.lastError)}</span><button data-act="retry">Retry now</button>`);
  else banner();
}

// ═══════════════════════ state & helpers ═══════════════════════
const S = {
  cfg: null, id: null, me: null, view: 'dash', cp: null, form: null, testAs: false,
  T: { section: '', sport: '', tab: 'checkins', lesson: null, cpName: '', data: null, overview: null, viewing: null, printMode: 'all', expanded: {} }
};
const CPS = () => S.cfg.checkpoints;
const studentMode = () => S.id.role === 'student' || S.testAs;
const skillsOf = sport => S.cfg.skills[sport] || [];
const skillDef = (sport, name) => skillsOf(sport).find(s => s.skill === name) || null;
function stageOf(score) { if (score === null || score === undefined || score === '') return 0; if (score <= S.cfg.stageBands[0]) return 1; if (score <= S.cfg.stageBands[1]) return 2; return 3; }
const stageName = n => n ? S.cfg.stageLabels[n - 1] : '';
function cpMode(cp) { const i = CPS().findIndex(c => c.name === cp.name); return i === 0 ? 'early' : (i === CPS().length - 1 ? 'end' : 'middle'); }
function testRow(me, cp, skill) { return me.tests.find(x => x.checkpoint === cp && x.skill === skill && x.score !== null) || null; }
function testScore(me, cp, skill) { const t = testRow(me, cp, skill); return t ? t.score : null; }
function latestScore(me, skill, uptoCp) { let v = null; for (const c of CPS()) { const s = testScore(me, c.name, skill); if (s !== null) v = s; if (uptoCp && c.name === uptoCp) break; } return v; }
function checkinOf(me, cp) { return me.checkins.find(c => c.checkpoint === cp) || null; }
function cpDone(me, cp) { const c = checkinOf(me, cp.name); return !!(c && (c.focusSkill || c.wentWell || c.nextGoal || c.drillStep !== null)) || me.tests.some(t => t.checkpoint === cp.name && t.score !== null); }
function nextCheckpoint(me) { return CPS().find(cp => !cpDone(me, cp)) || null; }
function currentFocus(me) { let f = '', step = null, goal = '', ext = '', extDrill = ''; CPS().forEach(c => { const x = checkinOf(me, c.name); if (!x) return; if (x.focusSkill) f = x.focusSkill; if (x.goal) goal = x.goal; if (x.drillStep !== null) step = x.drillStep; if (x.extensionSkill) { ext = x.extensionSkill; extDrill = x.extensionDrill || ''; } }); return { skill: f, step, goal, extension: ext, extensionDrill: extDrill }; }
function gameLabel(n) { return n ? S.cfg.gameLevels[n - 1] : ''; }
function outcomeRow(me, cp, outcome) { return (me.outcomes || []).find(x => x.checkpoint === cp && x.outcome === outcome) || null; }
function oChip(v, teacher) { return v ? `<span class="chip ${teacher ? 't' : ''} st${v}" title="${esc(S.cfg.outcomeLabels[v - 1])}${teacher ? ' (teacher)' : ''}">${v}</span>` : `<span class="chip none">·</span>`; }
function stageChip(score, extra) { const st = stageOf(score); return st ? `<span class="chip st${st} ${extra || ''}" title="${esc(stageName(st))}">${fmt(score, 0)}</span>` : `<span class="chip none">·</span>`; }
function bandsLegend() { const cfg = S.cfg; return cfg.stageLabels.map((l, i) => `<span><span class="chip st${i + 1}">${i === 0 ? '0–' + cfg.stageBands[0] : i === 1 ? (cfg.stageBands[0] + 1) + '–' + cfg.stageBands[1] : (cfg.stageBands[1] + 1) + '–' + cfg.scoreMax}</span> ${esc(l)}</span>`).join(''); }
function draftGoal(me, skill, cp, scoreOverride) {
  const s = scoreOverride !== undefined ? scoreOverride : latestScore(me, skill, cp); const st = stageOf(s); const max = S.cfg.scoreMax;
  const nextSt = Math.min(3, (st || 1) + 1);
  const target = nextSt === 2 ? S.cfg.stageBands[0] + 1 : S.cfg.stageBands[1] + 1;
  const def = skillDef(me.sport, skill); const steps = def && def.drills.length ? '1 to ' + Math.min(def.drills.length, 3) : '1 to 3';
  const nextCp = CPS()[CPS().findIndex(c => c.name === cp) + 1]; const cpName = nextCp ? nextCp.name : 'End';
  return (S.cfg.goalTemplate || '')
    .replace('{skill}', skill.toLowerCase()).replace('{stage}', stageName(st || 1)).replace('{score}', s === null ? '?' : fmt(s, 0))
    .replace('{nextStage}', stageName(nextSt)).replace('{target}', target).replace(/\{max\}/g, max).replace('{checkpoint}', cpName).replace('{steps}', steps);
}

// ═══════════════════════ boot ═══════════════════════
async function boot() {
  try {
    const b = await call('bootstrap');
    S.cfg = b.config; S.id = b.identity;
    Outbox.load();
    if (S.id.role === 'student') S.me = b.student;
    if (S.id.role === 'teacher') {
      S.T.section = (URL_SECTION && S.cfg.sections.indexOf(URL_SECTION) !== -1) ? URL_SECTION : (S.cfg.sections[0] || '');
      if (URL_VIEW) S.T.tab = URL_VIEW;
      S.T.sport = S.id.sport && S.cfg.sports.indexOf(S.id.sport) !== -1 ? S.id.sport : '';
    }
    render(); Outbox.drain();
    if (S.id.role === 'teacher' && S.T.section) loadSection(S.T.section);
  } catch (e) {
    $('#app').innerHTML = `<div class="notice"><h2>Could not load</h2><p>${esc(e.message)}</p><p><button class="pill-btn primary" data-act="reload">Try again</button></p></div>`;
  }
}
function render() {
  const app = $('#app');
  if (S.id.role === 'unknown') app.innerHTML = renderUnknown();
  else if (studentMode()) app.innerHTML = S.view === 'cpform' ? renderCpForm(S.me, S.cp, false) : renderStudentPage(S.me, false);
  else app.innerHTML = renderTeacher();
  updateSaveState(); window.scrollTo(0, 0);
}
function renderUnknown() {
  const email = S.id.email;
  return `<div class="notice">
    <h2>${email ? 'You are not on the roster yet' : 'Please sign in with your school Google account'}</h2>
    ${email ? `<p>You are signed in as <code>${esc(email)}</code>, but that address is not on any class list for <b>${esc(S.cfg.unitName)}</b>.</p><p>Ask your teacher to add this exact email to the <b>Roster</b> tab, then reload this page.</p>`
            : `<p>This page could not see who you are. Open it in a browser where you are signed in to your school account (not a private window), or ask your teacher to check that the app is shared with "Anyone within the school".</p>`}
    <p><button class="pill-btn primary" data-act="reload">Reload</button></p></div>`;
}

// ═══════════════════════ student dashboard ═══════════════════════
function renderStudentPage(me, asTeacher) {
  const cfg = S.cfg, cps = CPS(), next = nextCheckpoint(me), skills = skillsOf(me.sport), focus = currentFocus(me);
  const head = `<div class="topbar">
      ${asTeacher ? `<button class="pill-btn" data-act="t-back">&larr; Students</button>` : ''}
      ${S.testAs ? `<button class="pill-btn" data-act="test-as-off">&larr; Back to teacher view</button>` : ''}
      ${avatar(me.student)}
      <div><div class="title">${esc(me.student)}</div><div class="sub">${esc(cfg.unitName)} &middot; ${esc(me.sport)} &middot; ${esc(me.section)}${asTeacher ? ' &middot; <b>teacher view</b>' : ''}</div></div>
      <div class="grow"></div><div class="savestate" id="savestate"></div></div>`;

  const strip = `<div class="cp-strip">${cps.map(cp => { const done = cpDone(me, cp), isNext = next && next.name === cp.name; const ci = checkinOf(me, cp.name); return `<div class="cp-card ${done ? 'done' : ''} ${isNext ? 'next' : ''}">
      <div class="cp-name">${esc(cp.name)} check-in</div>
      <div class="small muted">lesson ${cp.lesson}</div>
      <div class="cp-status ${done ? 'done' : 'muted'}">${done ? (ci && ci.confirmed ? '✓ Done · teacher confirmed' : '✓ Done') : (isNext ? 'Up next' : 'Not yet')}</div>
      <button class="pill-btn ${isNext && !done ? 'primary' : ''} small" data-act="open-cp" data-cp="${esc(cp.name)}">${done ? 'Edit' : 'Enter now'}</button></div>`; }).join('')}</div>`;

  let focusCard;
  if (focus.skill) {
    const def = skillDef(me.sport, focus.skill); const step = focus.step || 0;
    focusCard = `<div class="card"><div class="card-head amber">My focus skill <span class="right">${esc(focus.skill)}</span></div><div class="card-body">
      <div class="goal">${focus.goal ? esc(focus.goal) : '<span class="faint">No goal written yet.</span>'}</div>
      ${def && def.drills.length ? `<div class="steps">${def.drills.map(d => `<div class="step ${d.step <= step ? 'done' : (d.step === step + 1 ? 'now' : '')}"><span class="step-n">${d.step}</span><div><div class="step-name">${esc(d.drill)}</div><div class="step-crit">${esc(d.criteria)}</div></div><span class="step-mark">${d.step <= step ? '✓' : (d.step === step + 1 ? 'now' : '')}</span></div>`).join('')}</div>` : ''}
      ${focus.extension ? `<div class="ext"><div class="ext-title">Extension · ${esc(focus.extension)}</div><div class="ext-body">${esc(focus.extensionDrill || 'Drill chosen with your teacher.')}</div></div>` : (def && def.drills.length && step >= def.drills.length ? `<div class="hint">All steps signed off. Choose an extension skill at your next check-in.</div>` : '')}
    </div></div>`;
  } else {
    focusCard = `<div class="card"><div class="card-head amber">My focus skill</div><div class="card-body"><div class="empty">Chosen at the <b>${esc(cps[0] ? cps[0].name : 'Early')}</b> check-in.</div></div></div>`;
  }

  const skillsCard = `<div class="card"><div class="card-head">My ${esc(me.sport)} skills <span class="right">out of ${cfg.scoreMax}</span></div><div class="card-body"><div class="tbl-wrap">
    <table class="tbl"><thead><tr><th>Skill</th>${cps.map(cp => `<th class="c">${esc(cp.name)}</th>`).join('')}<th>Stage now</th></tr></thead><tbody>
    ${skills.map(s => { const last = latestScore(me, s.skill); const st = stageOf(last); const isF = s.skill === focus.skill; return `<tr class="${isF ? 'focus-row' : ''}"><td class="skill">${isF ? '★ ' : ''}${esc(s.skill)}<span class="cue">${esc(s.test)}</span></td>
      ${cps.map(cp => { const v = testScore(me, cp.name, s.skill); const ci = checkinOf(me, cp.name); const self = ci && ci.selfStages && ci.selfStages[s.skill]; return `<td class="c">${stageChip(v)}${self ? `<span class="self-note">me: ${esc(stageName(self))}</span>` : ''}</td>`; }).join('')}
      <td>${st ? `<span class="stage-pill st${st}">${esc(stageName(st))}</span>` : '<span class="faint">not tested</span>'}</td></tr>`; }).join('')}
    </tbody></table></div><div class="legend">${bandsLegend()}</div></div></div>`;

  let part = '';
  if (cfg.dailyRegister) {
    const attended = me.register.filter(r => r.participation).length;
    part = `<div class="card"><div class="card-head green">Participation <span class="right">${attended} of ${me.lessonsRun || 0}</span></div><div class="card-body">
      <div class="dots">${cfg.lessons.map(l => { const r = me.register.find(x => x.lesson === l.number); const lvl = r && r.participation; const isCp = cps.some(c => c.lesson === l.number);
        return `<div class="dot ${lvl ? 'p' + lvl : ''} ${isCp ? 'cp' : ''}" title="Lesson ${l.number}${lvl ? ' · ' + esc(cfg.participationLabels[lvl - 1]) : ''}${r && r.note ? ' · ' + esc(r.note) : ''}">L${l.number}</div>`; }).join('')}</div>
      <div class="legend">${cfg.participationLabels.map((l, i) => `<span><span class="dot p${i + 1}" style="display:inline-flex;width:18px;height:18px;border-radius:5px"></span> ${esc(l)}</span>`).join('')}</div></div></div>`;
  }

  const endCp = cps[cps.length - 1]; const endCi = endCp ? checkinOf(me, endCp.name) : null; const gp = endCi && endCi.gamePlay;
  const gameCard = `<div class="card"><div class="card-head purple">Game-play assessment <span class="right">teacher, last two lessons</span></div><div class="card-body">
    ${gp ? `<div class="game-level"><span class="gl-big">${esc(gameLabel(gp))}</span><span class="gl-sub">${esc(focus.skill || 'your focus skill')} in game play</span></div>` : `<div class="empty">Your teacher watches your ${focus.skill ? esc(focus.skill) : 'focus skill'} in game play during the last two lessons.</div>`}
    <div class="legend">${cfg.gameLevels.map((l, i) => `<span><span class="chip gl${i + 1}">${esc(l)}</span></span>`).join('')}</div></div></div>`;

  let outcomesCard = '';
  if (cfg.outcomes.length) {
    outcomesCard = `<div class="card"><div class="card-head dark">Personal skills <span class="right">me · teacher</span></div><div class="card-body"><div class="tbl-wrap">
      <table class="tbl"><thead><tr><th></th>${cps.map(cp => `<th class="c">${esc(cp.name)}</th>`).join('')}</tr></thead><tbody>
      <tr><td class="skill"><b>Teacher rating</b><span class="cue">at each check-in</span></td>${cps.map(cp => { const ci = checkinOf(me, cp.name); return `<td class="c">${oChip(ci && ci.personal, true)}</td>`; }).join('')}</tr>
      ${cfg.outcomes.map(o => `<tr><td class="skill">${esc(o.outcome)}<span class="cue">${esc(o.looksLike)}</span></td>${cps.map(cp => { const r = outcomeRow(me, cp.name, o.outcome); return `<td class="c"><span class="chip-pair">${oChip(r && r.self, false)}${oChip(r && r.teacher, true)}</span></td>`; }).join('')}</tr>`).join('')}
      </tbody></table></div><div class="legend">${cfg.outcomeLabels.map((l, i) => `<span><span class="chip st${i + 1}">${i + 1}</span> ${esc(l)}</span>`).join('')}<span><span class="chip t st3">3</span> teacher</span></div></div></div>`;
  }

  const refl = `<div class="card"><div class="card-head coral">My check-ins</div><div class="card-body">
    ${cps.filter(cp => checkinOf(me, cp.name)).length === 0 ? `<div class="empty">Nothing entered yet.</div>` :
      cps.map(cp => { const c = checkinOf(me, cp.name); if (!c) return ''; const mode = cpMode(cp); return `<div class="refl"><div class="cp">${esc(cp.name)} ${c.focusSkill ? `<span class="tag">focus: ${esc(c.focusSkill)}</span>` : ''} ${c.drillStep ? `<span class="tag">drill step ${c.drillStep}</span>` : ''} ${c.extensionSkill ? `<span class="tag">extension: ${esc(c.extensionSkill)}</span>` : ''}</div>
        ${c.goal && mode === 'early' ? `<div class="q">Goal</div><div class="a">${esc(c.goal)}</div>` : ''}
        ${c.wentWell ? `<div class="q">${esc(mode === 'early' ? cfg.earlyPrompt : cfg.reflectionPrompts[0])}</div><div class="a">${esc(c.wentWell)}</div>` : ''}
        ${c.nextGoal ? `<div class="q">${esc(cfg.reflectionPrompts[1])}</div><div class="a">${esc(c.nextGoal)}</div>` : ''}</div>`; }).join('')}</div></div>`;

  let grades = '';
  if ((asTeacher || cfg.showGradesToStudents) && me.grades.some(g => g.score)) {
    grades = `<div class="card"><div class="card-head dark">Grades</div><div class="card-body"><div class="tbl-wrap"><table class="tbl"><thead><tr><th>Criterion</th><th class="c">Score</th><th>Comment</th></tr></thead><tbody>
      ${cfg.criteria.map(c => { const g = me.grades.find(x => x.criterion === c.code); if (!g || !g.score) return ''; return `<tr><td><b>${esc(c.code)}</b> ${esc(c.name)}</td><td class="c"><span class="chip st2">${g.score}</span></td><td style="white-space:normal">${esc(g.comment)}</td></tr>`; }).join('')}</tbody></table></div></div></div>`;
  }
  return head + strip + focusCard + skillsCard + `<div class="grid cols-2">${part}${gameCard}${part ? '' : outcomesCard}</div>` + (part ? outcomesCard : '') + refl + grades;
}

// ═══════════════════════ check-in form ═══════════════════════
// Early: student types all test scores (teacher confirms), picks focus skill, goal, one question.
// Middle: student types focus-skill retest, drill step, self-stage on the focus skill, one reflection.
// End: drill step, self-stage on the focus skill, personal skills, two reflections.

  't-confirm'(t) { const c = tCheckin(t.dataset.student); c.confirmed = !c.confirmed; putTeacherCheckin(t.dataset.student, { confirmed: c.confirmed }); render(); },
  't-game'(t) { const c = tCheckin(t.dataset.student), n = parseInt(t.dataset.n, 10); c.gamePlay = c.gamePlay === n ? null : n; putTeacherCheckin(t.dataset.student, { gamePlay: c.gamePlay }); render(); },
  't-pers'(t) { const c = tCheckin(t.dataset.student), n = parseInt(t.dataset.n, 10); c.personal = c.personal === n ? null : n; putTeacherCheckin(t.dataset.student, { personal: c.personal }); render(); },
  't-expand'(t) { S.T.expanded[t.dataset.student] = !S.T.expanded[t.dataset.student]; render(); },
  't-outcome'(t) { const student = t.dataset.student, outcome = t.dataset.outcome; const x = S.T.data.outcomes.find(y => y.student === student && y.checkpoint === S.T.cpName && y.outcome === outcome); const cur = x && x.teacher ? x.teacher : 0; const next = cur >= 3 ? null : cur + 1; setOutcome(student, outcome, next); t.className = 'cyc sm ' + (next ? 'st' + next : ''); t.innerHTML = (next || '–') + `<small>self ${x && x.self ? x.self : '–'}</small>`; },
  reg(t) { const student = t.dataset.student, n = parseInt(t.dataset.n, 10); const e = regEntry(student, S.T.lesson); setRegister(student, S.T.lesson, { participation: e && e.participation === n ? null : n }); render(); },
  'reg-all'(t) { const n = parseInt(t.dataset.n, 10); groupRoster().forEach(r => { const e = regEntry(r.student, S.T.lesson); if (!e || !e.participation) setRegister(r.student, S.T.lesson, { participation: n }); }); render(); },
  grade(t) { const student = t.dataset.student, code = t.dataset.code, n = parseInt(t.dataset.n, 10); const o = S.T.overview.find(x => x.student === student); const cur = o && o.final[code] && o.final[code].score; setGrade(student, code, { score: cur === n ? null : n }); render(); },
  'grade-comment'(t) { const student = t.dataset.student, code = t.dataset.code; const o = S.T.overview.find(x => x.student === student); const cur = (o && o.final[code] && o.final[code].comment) || ''; const v = window.prompt(`Comment for ${student} · ${code}`, cur); if (v === null) return; setGrade(student, code, { comment: v.trim() }); render(); },
  'accept-sug'() { let n = 0; S.T.overview.forEach(o => { S.cfg.criteria.forEach(c => { const sug = o.suggested[c.code]; if (sug && !(o.final[c.code] && o.final[c.code].score)) { setGrade(o.student, c.code, { score: sug }); n++; } }); }); render(); toast(`Accepted ${n} suggested grade${n === 1 ? '' : 's'} — adjust any you disagree with`); },
  'ov-refresh'() { S.T.overview = null; render(); loadOverview(); },
  'print-mode'(t) { S.T.printMode = t.dataset.v; render(); },
  print() { window.print(); }
};
document.addEventListener('click', e => { const t = e.target.closest('[data-act]'); if (!t) return; if (t.tagName === 'A') e.preventDefault(); const fn = actions[t.dataset.act]; if (fn) fn(t, e); });
document.addEventListener('input', e => {
  const t = e.target; const k = t.dataset && t.dataset.in; if (!k) return;
  if (k === 'wentWell' || k === 'nextGoal') S.form[k] = t.value;
  if (k === 'goal') { S.form.goal = t.value; S.form.goalTouched = true; }
  if (k === 'extensionSkill' || k === 'extensionDrill') S.form[k] = t.value;
  if (k === 'score') { S.form.scores[t.dataset.skill] = t.value; const pill = document.querySelector(`[data-stage-for="${CSS.escape(t.dataset.skill)}"]`); if (pill) { const st = stageOf(num(t.value)); pill.className = 'stage-pill st' + st; pill.textContent = st ? stageName(st) : '–'; } }
});
document.addEventListener('change', e => {
  const t = e.target; const k = t.dataset && t.dataset.in; if (!k) return;
  if (k === 'reg-note') setRegister(t.dataset.student, S.T.lesson, { note: t.value.trim() });
  if (k === 'tscore') setTeacherScore(t.dataset.student, t.dataset.skill, t.value);
  if (k === 'score' && S.form && S.form.mode === 'early') { const sc = num(S.form.scores[S.form.focusSkill]); if ((!S.form.goalTouched || /\(\?\//.test(S.form.goal)) && S.form.focusSkill && sc !== null) { S.form.goal = draftGoal(S.me, S.form.focusSkill, S.cp.name, sc); S.form.goalTouched = false; } render(); }
});

boot();
})();
</script>
