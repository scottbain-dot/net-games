<script>
(function () {
'use strict';

// ═══════════════════════ utils ═══════════════════════
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const $ = (sel, root) => (root || document).querySelector(sel);
const PALETTE = [
  ['#d4f0e4', '#0a5c35'], ['#e8e4ff', '#4a3a9a'], ['#ddeeff', '#1a4a7a'], ['#ffe4d4', '#7a2a0a'],
  ['#fff0d4', '#7a5a0a'], ['#fde4ee', '#8a2a5a'], ['#d4eeff', '#0a4a7a'], ['#e4ffd4', '#2a6a0a']
];
function initials(name) { const p = String(name).trim().split(/\s+/); return (((p[0] || '')[0] || '') + ((p[1] || '')[0] || '')).toUpperCase(); }
function hashIdx(name) { let h = 0; for (const ch of String(name)) h = (h * 31 + ch.charCodeAt(0)) >>> 0; return h % PALETTE.length; }
function avatar(name) { const c = PALETTE[hashIdx(name)]; return `<span class="avatar" style="background:${c[0]};color:${c[1]}">${esc(initials(name))}</span>`; }
const fmt = (v, d = 1) => (v === null || v === undefined || v === '' || isNaN(v)) ? '—' : Number(v).toFixed(d).replace(/\.0+$/, '');
const num = v => { if (v === '' || v === null || v === undefined) return null; const n = parseFloat(v); return isNaN(n) ? null : n; };
function toast(msg) { const t = $('#toast'); t.textContent = msg; t.classList.add('show'); clearTimeout(toast.t); toast.t = setTimeout(() => t.classList.remove('show'), 2200); }
function banner(kind, html) { const b = $('#banner'); if (!html) { b.className = 'banner'; b.innerHTML = ''; return; } b.className = 'banner show ' + kind; b.innerHTML = html; }

// ═══════════════════════ server bridge ═══════════════════════
function call(fn, ...args) {
  return new Promise((resolve, reject) => {
    if (!window.google || !google.script || !google.script.run) return reject(new Error('Not running inside the Apps Script web app'));
    google.script.run.withSuccessHandler(resolve).withFailureHandler(e => reject(new Error(e && e.message ? e.message : String(e))))[fn](...args);
  });
}

// ═══════════════════════ outbox ═══════════════════════
// Every write goes through here and is kept in localStorage (tagged with the
// login that created it) until the server confirms, so a wifi drop or reload
// never loses work.
const OUTBOX_KEY = 'mfs_outbox_v1';
const Outbox = {
  items: [], draining: false, failed: false, lastError: '', waiters: {},
  load() { try { this.items = JSON.parse(localStorage.getItem(OUTBOX_KEY) || '[]'); } catch (e) { this.items = []; } },
  persist() { try { localStorage.setItem(OUTBOX_KEY, JSON.stringify(this.items)); } catch (e) {} },
  mine() { return this.items.filter(i => i.owner === S.id.email); },
  add(fn, payload, label) {
    const id = String(Date.now()) + Math.random().toString(36).slice(2, 7);
    this.items.push({ id, fn, payload, label, owner: S.id.email, ts: Date.now() });
    this.persist();
    const p = new Promise((res, rej) => { this.waiters[id] = { res, rej }; });
    this.drain(); updateSaveState();
    return p;
  },
  async drain() {
    if (this.draining) return;
    this.draining = true;
    let item, sentOrphan = false;
    while ((item = this.mine()[0])) {
      try {
        await call(item.fn, item.payload);
        this.items = this.items.filter(i => i.id !== item.id); this.persist(); this.failed = false;
        if (this.waiters[item.id]) { this.waiters[item.id].res(); delete this.waiters[item.id]; } else sentOrphan = true;
      } catch (e) {
        this.failed = true; this.lastError = e.message;
        if (/Teachers only|not on roster|Unknown checkpoint|Missing/i.test(e.message)) {
          this.items = this.items.filter(i => i.id !== item.id); this.persist();
          if (this.waiters[item.id]) { this.waiters[item.id].rej(e); delete this.waiters[item.id]; }
          continue;
        }
        break;
      }
      updateSaveState();
    }
    this.draining = false; updateSaveState();
    if (sentOrphan) refreshAfterOutbox();
  },
  retry() { this.failed = false; updateSaveState(); this.drain(); }
};
async function refreshAfterOutbox() {
  try {
    if (S.id.role === 'student') { S.me = await call('getStudent', S.me.section, S.me.student); if (S.view === 'dash') render(); toast('Earlier changes sent ✓'); }
    else if (S.T.section) { S.T.data = await call('getSectionData', S.T.section); S.T.overview = null; if (['register', 'tests', 'agility', 'students'].indexOf(S.T.tab) !== -1) render(); toast('Earlier changes sent ✓'); }
  } catch (e) {}
}
// Coalesces rapid teacher taps into one request per (section, lesson/checkpoint).
const Pending = {
  map: {}, timer: null,
  put(key, fn, base, entryKey, entry) {
    const p = this.map[key] || (this.map[key] = { fn, base, entries: {} });
    p.entries[entryKey] = Object.assign(p.entries[entryKey] || {}, entry);
    clearTimeout(this.timer); this.timer = setTimeout(() => this.flush(), 900); updateSaveState();
  },
  count() { return Object.keys(this.map).length; },
  flush() {
    clearTimeout(this.timer);
    const m = this.map; this.map = {};
    Object.keys(m).forEach(key => { const p = m[key]; Outbox.add(p.fn, Object.assign({}, p.base, { entries: Object.values(p.entries) }), key).catch(() => {}); });
  }
};
window.addEventListener('beforeunload', () => Pending.flush());
function updateSaveState() {
  const el = $('#savestate'); if (!el) return;
  const n = Outbox.mine().length + Pending.count();
  if (Outbox.failed) { el.className = 'savestate failed'; el.innerHTML = `${n} change${n === 1 ? '' : 's'} not saved · <a href="#" data-act="retry">retry</a>`; }
  else if (n > 0) { el.className = 'savestate pending'; el.textContent = 'Saving…'; }
  else { el.className = 'savestate'; el.textContent = 'All saved ✓'; }
  if (Outbox.failed) banner('warn', `Could not reach the server — your last change is kept on this device and will be re-sent. <span class="tiny">${esc(Outbox.lastError)}</span><button data-act="retry">Retry now</button>`);
  else banner();
}

// ═══════════════════════ state & helpers ═══════════════════════
const S = {
  cfg: null, id: null, me: null, view: 'dash', cp: null, form: null,
  T: { section: '', sport: '', tab: 'register', lesson: null, cpName: '', data: null, overview: null, viewing: null, printMode: 'all' }
};
const CPS = () => S.cfg.checkpoints;
const skillsOf = sport => S.cfg.skills[sport] || [];
const skillDef = (sport, name) => skillsOf(sport).find(s => s.skill === name) || null;
function stageOf(score) { if (score === null || score === undefined || score === '') return 0; if (score <= S.cfg.stageBands[0]) return 1; if (score <= S.cfg.stageBands[1]) return 2; return 3; }
const stageName = n => n ? S.cfg.stageLabels[n - 1] : '';
function testScore(me, cp, skill) { const t = me.tests.find(x => x.checkpoint === cp && x.skill === skill && x.score !== null); return t ? t.score : null; }
function latestScore(me, skill, uptoCp) { let v = null; for (const c of CPS()) { const s = testScore(me, c.name, skill); if (s !== null) v = s; if (uptoCp && c.name === uptoCp) break; } return v; }
function checkinOf(me, cp) { return me.checkins.find(c => c.checkpoint === cp) || null; }
function cpDone(me, cp) { const c = checkinOf(me, cp.name); return !!(c && (c.focusSkill || c.wentWell || c.nextGoal || c.agilityFocus)); }
function nextCheckpoint(me) { return CPS().find(cp => !cpDone(me, cp)) || null; }
function currentFocus(me) { let f = '', step = null, goal = '', ag = ''; CPS().forEach(c => { const x = checkinOf(me, c.name); if (!x) return; if (x.focusSkill) f = x.focusSkill; if (x.goal) goal = x.goal; if (x.drillStep !== null) step = x.drillStep; if (x.agilityFocus) ag = x.agilityFocus; }); return { skill: f, step, goal, agility: ag }; }
function outcomeRow(me, cp, outcome) { return (me.outcomes || []).find(x => x.checkpoint === cp && x.outcome === outcome) || null; }
function oChip(v, teacher) { return v ? `<span class="chip ${teacher ? 't' : ''} st${v}" title="${esc(S.cfg.outcomeLabels[v - 1])}${teacher ? ' (teacher)' : ''}">${v}</span>` : `<span class="chip none">·</span>`; }
function lessonByNumber(n) { return S.cfg.lessons.find(l => l.number === n); }
function stageChip(score, extra) { const st = stageOf(score); return st ? `<span class="chip st${st} ${extra || ''}" title="${esc(stageName(st))}">${fmt(score, 0)}</span>` : `<span class="chip none">·</span>`; }
function draftGoal(me, skill, cp) {
  const s = latestScore(me, skill, cp); const st = stageOf(s); const max = S.cfg.scoreMax;
  const nextSt = Math.min(3, (st || 1) + 1);
  const target = nextSt === 2 ? S.cfg.stageBands[0] + 1 : S.cfg.stageBands[1] + 1;
  const def = skillDef(me.sport, skill); const steps = def && def.drills.length ? '1 to ' + Math.min(def.drills.length, 3) : '1 to 3';
  const nextCp = CPS()[CPS().findIndex(c => c.name === cp) + 1]; const cpName = nextCp ? nextCp.name : 'End';
  return (S.cfg.goalTemplate || '')
    .replace('{skill}', skill.toLowerCase()).replace('{stage}', stageName(st || 1)).replace('{score}', s === null ? '?' : fmt(s, 0))
    .replace('{nextStage}', stageName(nextSt)).replace('{target}', target).replace(/\{max\}/g, max).replace('{checkpoint}', cpName).replace('{steps}', steps);
}

// ═══════════════════════ boot ═══════════════════════
async function boot() {
  try {
    const b = await call('bootstrap');
    S.cfg = b.config; S.id = b.identity;
    Outbox.load();
    if (S.id.role === 'student') S.me = b.student;
    if (S.id.role === 'teacher') {
      S.T.section = (URL_SECTION && S.cfg.sections.indexOf(URL_SECTION) !== -1) ? URL_SECTION : (S.cfg.sections[0] || '');
      if (URL_VIEW) S.T.tab = URL_VIEW;
      S.T.sport = S.id.sport && S.cfg.sports.indexOf(S.id.sport) !== -1 ? S.id.sport : '';
    }
    render(); Outbox.drain();
    if (S.id.role === 'teacher' && S.T.section) loadSection(S.T.section);
  } catch (e) {
    $('#app').innerHTML = `<div class="notice"><h2>Could not load</h2><p>${esc(e.message)}</p><p><button class="pill-btn primary" data-act="reload">Try again</button></p></div>`;
  }
}
function render() {
  const app = $('#app');
  if (S.id.role === 'unknown') app.innerHTML = renderUnknown();
  else if (S.id.role === 'student') app.innerHTML = S.view === 'cpform' ? renderCpForm(S.me, S.cp, false) : renderStudentPage(S.me, false);
  else app.innerHTML = renderTeacher();
  updateSaveState(); window.scrollTo(0, 0);
}
function renderUnknown() {
  const email = S.id.email;
  return `<div class="notice">
    <h2>${email ? 'You are not on the roster yet' : 'Please sign in with your school Google account'}</h2>
    ${email ? `<p>You are signed in as <code>${esc(email)}</code>, but that address is not on any class list for <b>${esc(S.cfg.unitName)}</b>.</p><p>Ask your teacher to add this exact email to the <b>Roster</b> tab, then reload this page.</p>`
            : `<p>This page could not see who you are. Open it in a browser where you are signed in to your school account (not a private window), or ask your teacher to check that the app is shared with "Anyone within the school".</p>`}
    <p><button class="pill-btn primary" data-act="reload">Reload</button></p></div>`;
}

// ═══════════════════════ student dashboard ═══════════════════════
function renderStudentPage(me, asTeacher) {
  const cfg = S.cfg, cps = CPS(), next = nextCheckpoint(me), skills = skillsOf(me.sport), focus = currentFocus(me);
  const head = `<div class="topbar">
      ${asTeacher ? `<button class="pill-btn" data-act="t-back">&larr; ${esc(S.T.section)} students</button>` : ''}
      ${avatar(me.student)}
      <div><div class="title">${esc(me.student)}</div><div class="sub">${esc(cfg.unitName)} &middot; ${esc(me.sport)} &middot; ${esc(me.section)}${asTeacher ? ' &middot; <b>teacher view</b>' : ''}</div></div>
      <div class="grow"></div><div class="savestate" id="savestate"></div></div>`;

  const strip = `<div class="cp-strip">${cps.map(cp => { const done = cpDone(me, cp), isNext = next && next.name === cp.name; return `<div class="cp-card ${done ? 'done' : ''} ${isNext ? 'next' : ''}">
      <div class="cp-name">${esc(cp.name)} check-in</div>
      <div class="small muted">lesson ${cp.lesson}${lessonByNumber(cp.lesson) ? ' · ' + esc(lessonByNumber(cp.lesson).title) : ''}</div>
      <div class="cp-status ${done ? 'done' : 'muted'}">${done ? '✓ Done' : (isNext ? 'Up next' : 'Not yet')}</div>
      <button class="pill-btn ${isNext && !done ? 'primary' : ''} small" data-act="open-cp" data-cp="${esc(cp.name)}">${done ? 'Edit' : 'Enter now'}</button></div>`; }).join('')}</div>`;

  let focusCard;
  if (focus.skill) {
    const def = skillDef(me.sport, focus.skill); const step = focus.step || 0;
    focusCard = `<div class="card"><div class="card-head amber">My focus skill <span class="right">${esc(focus.skill)}</span></div><div class="card-body">
      <div class="goal">${focus.goal ? esc(focus.goal) : '<span class="faint">No goal written yet — add one at your next check-in.</span>'}</div>
      ${def && def.drills.length ? `<div class="steps">${def.drills.map(d => `<div class="step ${d.step <= step ? 'done' : (d.step === step + 1 ? 'now' : '')}"><span class="step-n">${d.step}</span><div><div class="step-name">${esc(d.drill)}</div><div class="step-crit">${esc(d.criteria)}</div></div><span class="step-mark">${d.step <= step ? '✓' : (d.step === step + 1 ? 'now' : '')}</span></div>`).join('')}</div>
        <div class="hint">Step reached: <b>${step} of ${def.drills.length}</b> (from your last check-in). Peer checks and teacher sign-offs are on your paper log.</div>` : ''}
      ${focus.agility ? `<div class="hint">Agility element: <span class="tag">${esc(focus.agility)}</span></div>` : ''}
    </div></div>`;
  } else {
    focusCard = `<div class="card"><div class="card-head amber">My focus skill</div><div class="card-body"><div class="empty">Not chosen yet. Your teacher will test the key skills first, then you pick one focus skill at the <b>${esc(cps[0] ? cps[0].name : 'Early')}</b> check-in.</div></div></div>`;
  }

  const skillsCard = `<div class="card"><div class="card-head">My ${esc(me.sport)} skills <span class="right">score out of ${cfg.scoreMax} · teacher tested</span></div><div class="card-body"><div class="tbl-wrap">
    <table class="tbl"><thead><tr><th>Skill</th>${cps.map(cp => `<th class="c">${esc(cp.name)}<br><span class="tiny" style="text-transform:none;letter-spacing:0">L${cp.lesson}</span></th>`).join('')}<th>Stage now</th></tr></thead><tbody>
    ${skills.map(s => { const last = latestScore(me, s.skill); const st = stageOf(last); const isF = s.skill === focus.skill; return `<tr class="${isF ? 'focus-row' : ''}"><td class="skill">${isF ? '★ ' : ''}${esc(s.skill)}<span class="cue">${esc(s.test)}</span></td>
      ${cps.map(cp => { const v = testScore(me, cp.name, s.skill); const ci = checkinOf(me, cp.name); const self = ci && ci.selfStages && ci.selfStages[s.skill]; return `<td class="c">${stageChip(v)}${self ? `<span class="self-note" title="where you placed yourself">me: ${esc(stageName(self))}</span>` : ''}</td>`; }).join('')}
      <td>${st ? `<span class="stage-pill st${st}">${esc(stageName(st))}</span>` : '<span class="faint">not tested</span>'}</td></tr>`; }).join('')}
    </tbody></table></div>
    <div class="legend">${cfg.stageLabels.map((l, i) => `<span><span class="chip st${i + 1}">${i === 0 ? '0–' + cfg.stageBands[0] : i === 1 ? (cfg.stageBands[0] + 1) + '–' + cfg.stageBands[1] : (cfg.stageBands[1] + 1) + '–' + cfg.scoreMax}</span> ${esc(l)}</span>`).join('')}</div></div></div>`;

  const attended = me.register.filter(r => r.participation).length;
  const part = `<div class="card"><div class="card-head green">Participation <span class="right">${attended} of ${me.lessonsRun || 0} lesson${me.lessonsRun === 1 ? '' : 's'} so far</span></div><div class="card-body">
    <div class="dots">${cfg.lessons.map(l => { const r = me.register.find(x => x.lesson === l.number); const lvl = r && r.participation; const isCp = cps.some(c => c.lesson === l.number);
      return `<div class="dot ${lvl ? 'p' + lvl : ''} ${isCp ? 'cp' : ''}" title="L${l.number} ${esc(l.title)}${lvl ? ' · ' + esc(cfg.participationLabels[lvl - 1]) : ''}${r && r.note ? ' · ' + esc(r.note) : ''}">L${l.number}</div>`; }).join('')}</div>
    <div class="legend">${cfg.participationLabels.map((l, i) => `<span><span class="dot p${i + 1}" style="display:inline-flex;width:18px;height:18px;border-radius:5px"></span> ${esc(l)}</span>`).join('')}<span class="faint">Recorded by your teacher each lesson.</span></div></div></div>`;

  let test = '';
  if (cfg.test.name) {
    const b = me.agility.baseline, r = me.agility.retest; let delta = '';
    if (b !== null && r !== null) { const d = r - b, better = cfg.test.lowerIsBetter ? d < 0 : d > 0; const word = cfg.test.lowerIsBetter ? (better ? 'Faster' : 'Slower') : (better ? 'Higher' : 'Lower');
      delta = Math.abs(d) < 1e-9 ? `<div class="delta">No change</div>` : `<div class="delta ${better ? 'good' : 'bad'}">${word} by <b>${fmt(Math.abs(d), 2)} ${esc(cfg.test.unit)}</b></div>`; }
    test = `<div class="card"><div class="card-head purple">${esc(cfg.test.name)} <span class="right">teacher recorded</span></div><div class="card-body"><div class="test-grid">
      <div class="test-box"><div class="label">Baseline</div><div class="value ${b === null ? 'empty' : ''}">${b === null ? '—' : fmt(b, 2)}</div><div class="unit">${esc(cfg.test.unit)}</div></div>
      <div class="test-box"><div class="label">Re-test</div><div class="value ${r === null ? 'empty' : ''}">${r === null ? '—' : fmt(r, 2)}</div><div class="unit">${esc(cfg.test.unit)}</div></div></div>${delta}</div></div>`;
  }

  let outcomesCard = '';
  if (cfg.outcomes.length) {
    outcomesCard = `<div class="card"><div class="card-head dark">Personal skills <span class="right">me · teacher</span></div><div class="card-body"><div class="tbl-wrap">
      <table class="tbl"><thead><tr><th>Outcome</th>${cps.map(cp => `<th class="c">${esc(cp.name)}</th>`).join('')}</tr></thead><tbody>
      ${cfg.outcomes.map(o => `<tr><td class="skill">${esc(o.outcome)}<span class="cue">${esc(o.looksLike)}</span></td>${cps.map(cp => { const r = outcomeRow(me, cp.name, o.outcome); return `<td class="c"><span class="chip-pair">${oChip(r && r.self, false)}${oChip(r && r.teacher, true)}</span></td>`; }).join('')}</tr>`).join('')}
      </tbody></table></div><div class="legend">${cfg.outcomeLabels.map((l, i) => `<span><span class="chip st${i + 1}">${i + 1}</span> ${esc(l)}</span>`).join('')}<span><span class="chip t st3">3</span> teacher</span></div></div></div>`;
  }
  const refl = `<div class="card"><div class="card-head coral">My check-ins</div><div class="card-body">
    ${cps.filter(cp => cpDone(me, cp)).length === 0 ? `<div class="empty">Nothing entered yet.</div>` :
      cps.map(cp => { const c = checkinOf(me, cp.name); if (!c || !cpDone(me, cp)) return ''; return `<div class="refl"><div class="cp">${esc(cp.name)} ${c.focusSkill ? `<span class="tag">focus: ${esc(c.focusSkill)}</span>` : ''} ${c.agilityFocus ? `<span class="tag">agility: ${esc(c.agilityFocus)}</span>` : ''} ${c.drillStep ? `<span class="tag">drill step ${c.drillStep}</span>` : ''}</div>
        ${c.goal ? `<div class="q">Goal</div><div class="a">${esc(c.goal)}</div>` : ''}
        ${c.wentWell ? `<div class="q">${esc(cfg.reflectionPrompts[0])}</div><div class="a">${esc(c.wentWell)}</div>` : ''}
        ${c.nextGoal ? `<div class="q">${esc(cfg.reflectionPrompts[1])}</div><div class="a">${esc(c.nextGoal)}</div>` : ''}</div>`; }).join('')}</div></div>`;

  let grades = '';
  if ((asTeacher || cfg.showGradesToStudents) && me.grades.some(g => g.score)) {
    grades = `<div class="card"><div class="card-head dark">Grades</div><div class="card-body"><div class="tbl-wrap"><table class="tbl"><thead><tr><th>Criterion</th><th class="c">Score</th><th>Comment</th></tr></thead><tbody>
      ${cfg.criteria.map(c => { const g = me.grades.find(x => x.criterion === c.code); if (!g || !g.score) return ''; return `<tr><td><b>${esc(c.code)}</b> ${esc(c.name)}</td><td class="c"><span class="chip st2">${g.score}</span></td><td style="white-space:normal">${esc(g.comment)}</td></tr>`; }).join('')}</tbody></table></div></div></div>`;
  }
  return head + strip + focusCard + skillsCard + `<div class="grid cols-2">${part}${test}</div>` + outcomesCard + refl + grades;
}

// ═══════════════════════ check-in form ═══════════════════════
function openCpForm(me, cpName) {
  const cp = CPS().find(c => c.name === cpName); if (!cp) return;
  const existing = checkinOf(me, cp.name) || {};
  const prev = currentFocus(me);
  S.cp = cp;
  S.form = {
    focusSkill: existing.focusSkill || prev.skill || '',
    goal: existing.goal || prev.goal || '',
    goalTouched: !!(existing.goal || prev.goal),
    drillStep: existing.drillStep !== null && existing.drillStep !== undefined ? existing.drillStep : (prev.step || 0),
    agilityFocus: existing.agilityFocus || '',
    selfStages: Object.assign({}, existing.selfStages || {}),
    selfOutcomes: (() => { const o = {}; S.cfg.outcomes.forEach(x => { const r = outcomeRow(me, cp.name, x.outcome); if (r && r.self) o[x.outcome] = r.self; }); return o; })(),
    wentWell: existing.wentWell || '', nextGoal: existing.nextGoal || '', sending: false
  };
  if (S.form.focusSkill && !S.form.goal) S.form.goal = draftGoal(me, S.form.focusSkill, cp.name);
  if (S.id.role === 'student') S.view = 'cpform'; else S.T.tab = 'cpform';
  render();
}
function renderCpForm(me, cp, asTeacher) {
  const cfg = S.cfg, f = S.form, skills = skillsOf(me.sport);
  const idx = CPS().findIndex(c => c.name === cp.name);
  const isFirst = idx === 0;
  const def = f.focusSkill ? skillDef(me.sport, f.focusSkill) : null;
  return `<div class="topbar"><button class="pill-btn" data-act="cp-cancel">&larr; Back</button>

async function saveCpForm() {
  const me = S.me, cp = S.cp, f = S.form;
  if (!f.focusSkill && !f.wentWell && !f.nextGoal && !f.agilityFocus && !Object.keys(f.selfStages).length) { toast('Pick a focus skill or write a reflection first'); return; }
  const payload = { section: me.section, student: me.student, checkpoint: cp.name, focusSkill: f.focusSkill, goal: f.goal, drillStep: f.drillStep, agilityFocus: f.agilityFocus, selfStages: f.selfStages, selfOutcomes: f.selfOutcomes, wentWell: f.wentWell, nextGoal: f.nextGoal };
  me.outcomes = me.outcomes || [];
  Object.keys(f.selfOutcomes).forEach(k => { let r = outcomeRow(me, cp.name, k); if (!r) { r = { checkpoint: cp.name, outcome: k, self: null, teacher: null }; me.outcomes.push(r); } r.self = f.selfOutcomes[k]; });
  let c = checkinOf(me, cp.name); if (!c) { c = { checkpoint: cp.name }; me.checkins.push(c); }
  Object.assign(c, { focusSkill: f.focusSkill, goal: f.goal, drillStep: f.drillStep, agilityFocus: f.agilityFocus, selfStages: Object.assign({}, f.selfStages), wentWell: f.wentWell, nextGoal: f.nextGoal });

  let settled = false;
  const watch = setInterval(() => { if (settled) { clearInterval(watch); return; } if (Outbox.failed) { clearInterval(watch); settled = true; f.sending = false; goBack(); toast('Saved on this device — will send when the connection returns'); } }, 400);
  try { await Outbox.add('saveCheckin', payload, 'check-in ' + cp.name); if (settled) return; settled = true; f.sending = false; goBack(); toast('Check-in saved ✓'); }
  catch (e) { if (settled) return; settled = true; f.sending = false; render(); const st = $('#cp-status'); if (st) st.textContent = 'Not saved: ' + e.message; }
}
function syncTeacherCache(me) {

  const cfg = S.cfg, T = S.T;
  if (!T.overview) { if (!T._loadingOv) { T._loadingOv = true; loadOverview().finally(() => { T._loadingOv = false; }); } return `<div class="loading"><div class="spinner"></div> Building overview…</div>`; }
  const evLabel = { test: 'focus-skill gain + ' + (cfg.test.name || 'test'), reflection: 'check-ins, goal, self-assessment, drill progress', participation: 'register', skills: 'all skill scores at the end', outcomes: 'your personal-skill ratings', none: 'no automatic evidence' };
  return `<div class="card"><div class="card-body small muted"><b>Suggested</b> scores (dashed) come from the evidence: ${cfg.criteria.map(c => `<b>${esc(c.code)}</b> ← ${esc(evLabel[c.evidence])}`).join(' · ')}. A starting point only. Tap a number to set the <b>final</b> grade; ✎ adds a comment. "Build grade report tab" in the Sheet menu exports everything.</div></div>
    <div class="card"><div class="card-head dark">Overview · ${esc(T.section)}${T.sport ? ' · ' + esc(T.sport) : ''} <span class="right"><a href="#" data-act="ov-refresh" style="color:#fff">refresh</a></span></div><div class="card-body"><div class="tbl-wrap">
    <table class="tbl ov"><thead><tr><th class="sticky">Student</th><th class="c">Lessons</th><th class="c">Particip.</th><th class="c">Check-ins</th><th>Focus skill</th><th class="c">Focus score</th><th class="c">Drill</th><th class="c">Self-assess</th>${cfg.outcomes.length ? '<th class="c">Personal<br><span class="tiny" style="text-transform:none;letter-spacing:0">teacher / self</span></th>' : ''}${cfg.test.name ? `<th class="c">${esc(cfg.test.name)}</th>` : ''}<th>Grades <span class="tiny" style="text-transform:none;letter-spacing:0">(dashed = suggested)</span></th></tr></thead><tbody>
    ${T.overview.map(o => `<tr><td class="sticky"><b>${esc(o.student)}</b>${!T.sport ? `<span class="sug-note">${esc(o.sport)}</span>` : ''}</td>
      <td class="c">${o.lessonsAttended}/${o.lessonsRun}</td>
      <td class="c">${o.participationAvg === null ? '—' : fmt(o.participationAvg, 1) + '<span class="tiny muted">/3</span>'}</td>
      <td class="c">${o.checkins}/${CPS().length}<span class="sug-note">${o.reflections} reflections</span></td>
      <td>${o.focus ? esc(o.focus) + (o.chosenAtUnderstanding === false ? '<span class="sug-note">not at ' + esc(cfg.stageLabels[0]) + '</span>' : '') : '<span class="faint">—</span>'}</td>
      <td class="c">${o.focusStart === null ? '<span class="faint">—</span>' : `${stageChip(o.focusStart)} → ${o.focusEnd !== null && o.focusGain !== null ? stageChip(o.focusEnd) : '<span class="chip none">·</span>'}${o.focusGain !== null ? `<span class="sug-note" style="color:${o.focusGain > 0 ? 'var(--green)' : o.focusGain < 0 ? 'var(--red)' : 'inherit'}">${o.focusGain > 0 ? '+' : ''}${o.focusGain}</span>` : ''}`}</td>
      <td class="c">${o.maxSteps ? (o.drillStep || 0) + '/' + o.maxSteps : '<span class="faint">—</span>'}</td>
      <td class="c">${o.selfAccuracy === null ? '<span class="faint">—</span>' : Math.round(o.selfAccuracy * 100) + '%'}</td>
      ${cfg.outcomes.length ? `<td class="c">${fmt(o.outcomesTeacher, 1)} / ${fmt(o.outcomesSelf, 1)}</td>` : ''}
      ${cfg.test.name ? `<td class="c">${o.agility.change === null ? '<span class="faint">—</span>' : `<span style="color:${(cfg.test.lowerIsBetter ? o.agility.change < 0 : o.agility.change > 0) ? 'var(--green)' : 'var(--red)'}">${o.agility.change > 0 ? '+' : ''}${fmt(o.agility.change, 2)}</span><span class="sug-note">adj ${fmt(o.agility.adjusted, 2)}</span>`}</td>` : ''}
      <td class="grade-cell">${cfg.criteria.map(c => { const f = o.final[c.code] || {}, sug = o.suggested[c.code]; return `<div class="grade-line"><span class="grade-code" title="${esc(c.name)}">${esc(c.code)}</span><div class="score-row">${[1, 2, 3, 4, 5, 6, 7].map(n => `<button type="button" class="${f.score === n ? 'on' : ''} ${sug === n && f.score !== n ? 'sug' : ''}" data-act="grade" data-student="${esc(o.student)}" data-code="${esc(c.code)}" data-n="${n}">${n}</button>`).join('')}<button type="button" title="${esc(f.comment || 'Add comment')}" data-act="grade-comment" data-student="${esc(o.student)}" data-code="${esc(c.code)}" style="${f.comment ? 'background:#eef4fb;color:var(--blue)' : ''}">✎</button></div>${f.comment ? `<span class="grade-comment" title="${esc(f.comment)}">💬</span>` : ''}</div>`; }).join('')}</td>
    </tr>`).join('')}
    </tbody></table></div></div></div>`;
}
function setGrade(student, code, patch) {
  const o = S.T.overview.find(x => x.student === student); if (!o) return;
  o.final[code] = Object.assign(o.final[code] || {}, patch);
  Pending.put('grade|' + S.T.section, 'saveGrades', { section: S.T.section }, student + '|' + code, Object.assign({ student, criterion: code }, patch));
}

// ── print daily logs ──
function renderPrint() {
  const T = S.T; const roster = T.printMode === 'blank' ? [null] : groupRoster();
  return `<div class="toolbar no-print">
      <button class="subtab ${T.printMode === 'all' ? 'active' : ''}" data-act="print-mode" data-v="all">One sheet per student (${groupRoster().length})</button>
      <button class="subtab ${T.printMode === 'blank' ? 'active' : ''}" data-act="print-mode" data-v="blank">Blank sheet</button>
      <div class="grow"></div><span class="small muted">A4 portrait · one page each · best printed after the ${esc(CPS()[0] ? CPS()[0].name : 'Early')} check-in so each student's focus skill and drills are on it</span>
      <button class="pill-btn primary" data-act="print">Print</button></div>
    ${roster.map(r => renderSheet(r)).join('')}`;
}
function renderSheet(r) {
  const cfg = S.cfg, cps = CPS(); const T = S.T;
  const sport = r ? r.sport : (T.sport || '');
  const me = r ? { checkins: T.data.checkins.filter(x => x.student === r.student) } : { checkins: [] };
  const fc = currentFocus(me); const def = fc.skill ? skillDef(sport, fc.skill) : null;
  const skills = skillsOf(sport);
  const drillsBox = def
    ? `<div class="s-box"><h4>My drill progression · ${esc(fc.skill)}</h4><table class="s-drills"><thead><tr><th>Step</th><th>Drill</th><th>Peer check: I can…</th><th>Peer ✓</th><th>Teacher ✓</th></tr></thead><tbody>${def.drills.map(d => `<tr><td><b>${d.step}</b></td><td>${esc(d.drill)}</td><td>${esc(d.criteria)}</td><td class="box"></td><td class="box"></td></tr>`).join('')}</tbody></table></div>`
    : `<div class="s-box"><h4>Key skills${sport ? ' · ' + esc(sport) : ''}</h4><ul>${skills.map(s => `<li><b>${esc(s.skill)}</b> <span>· ${esc(s.test)}</span></li>`).join('')}</ul><div style="font-size:8.5pt;color:#555;margin-top:3px">Choose your focus skill at the ${esc(cps[0] ? cps[0].name : 'Early')} check-in. Your drill card for it follows.</div></div>`;
  return `<div class="sheet">
    <div class="s-head"><div><div class="u">${esc(cfg.unitName)} · Daily log · ${esc(T.section)}${sport ? ' · ' + esc(sport) : ''}</div><div class="n">${r ? esc(r.student) : '<span class="blank">&nbsp;</span>'}</div></div>
      <div style="text-align:right;font-size:8.5pt;color:#555">Fill in one line at the end of every lesson.<br>Get a peer check, then a teacher signature, before moving to the next drill step.</div></div>
    <div class="s-goal"><b>Focus skill:</b> ${fc.skill ? esc(fc.skill) : '<span class="blank">&nbsp;</span>'} &nbsp; <b>Goal:</b> ${fc.goal ? esc(fc.goal) : '<span class="blank" style="min-width:110mm">&nbsp;</span>'}</div>
    <div class="s-cols">${drillsBox}
      <div class="s-box"><h4>Agility elements (write the number)</h4>${cfg.focus.length ? `<ol class="two">${cfg.focus.map(f => `<li><b>${esc(f.focus)}</b>${f.cue ? ` <span>· ${esc(f.cue)}</span>` : ''}</li>`).join('')}</ol>` : ''}
        <h4 style="margin-top:4px">Effort</h4><div style="font-size:9pt">${cfg.participationLabels.map((l, i) => `${i + 1} = ${esc(l)}`).join(' · ')}</div></div></div>
    <table><thead><tr><th style="width:7mm">L</th><th style="width:15mm">Date</th><th>Lesson</th><th style="width:11mm">Drill step</th><th style="width:11mm">Agility #</th><th style="width:15mm">Effort</th><th>One thing I learned / will change next time</th><th style="width:10mm">Tchr</th></tr></thead><tbody>
    ${cfg.lessons.map(l => { const isCp = cps.some(c => c.lesson === l.number); return `<tr class="${isCp ? 'cp' : ''}"><td class="tall"><b>${l.number}</b></td><td>${esc(l.date || '')}</td><td class="ttl">${esc(l.title)}</td><td></td><td></td><td class="circ">1 2 3</td><td></td><td></td></tr>`; }).join('')}
    </tbody></table>
    <div class="s-foot"><span>Check-ins on the laptop: ${cps.map(c => `<b>${esc(c.name)}</b> L${c.lesson}`).join(' · ')}</span><span>${cfg.test.name ? `${esc(cfg.test.name)}: baseline ______ ${esc(cfg.test.unit)} &nbsp; re-test ______ ${esc(cfg.test.unit)}` : ''}</span></div>
  </div>`;
}

// ═══════════════════════ events ═══════════════════════
const actions = {
  reload() { location.reload(); },
  retry() { Outbox.retry(); },
  'open-cp'(t) { openCpForm(S.me, t.dataset.cp); },
  'cp-cancel'() { if (S.id.role === 'student') S.view = 'dash'; else S.T.tab = 'student'; render(); },
  'cp-save'() { saveCpForm(); },
  self(t) { const sk = t.dataset.skill, n = parseInt(t.dataset.n, 10); if (S.form.selfStages[sk] === n) delete S.form.selfStages[sk]; else S.form.selfStages[sk] = n; Array.from(t.parentElement.children).forEach(b => { b.className = ''; }); if (S.form.selfStages[sk]) t.className = 'on st' + n; },
  'self-outcome'(t) { const k = t.dataset.outcome, n = parseInt(t.dataset.n, 10); if (S.form.selfOutcomes[k] === n) delete S.form.selfOutcomes[k]; else S.form.selfOutcomes[k] = n; Array.from(t.parentElement.children).forEach(b => { b.className = ''; }); if (S.form.selfOutcomes[k]) t.className = 'on st' + n; },
  't-outcome'(t) { const student = t.dataset.student, outcome = t.dataset.outcome; const x = tOutcome(student, S.T.cpName, outcome); const cur = x && x.teacher ? x.teacher : 0; const next = cur >= 3 ? null : cur + 1; setOutcome(student, outcome, next); t.className = 'cyc ' + (next ? 'st' + next : ''); t.innerHTML = (next || '–') + `<small>self ${x && x.self ? x.self : '–'}</small>`; },
  'focus-skill'(t) { const v = t.dataset.v; const changed = S.form.focusSkill !== v; S.form.focusSkill = v; if (changed) { S.form.drillStep = 0; if (!S.form.goalTouched) S.form.goal = draftGoal(S.me, v, S.cp.name); } render(); },
  'goal-redraft'() { if (S.form.focusSkill) { S.form.goal = draftGoal(S.me, S.form.focusSkill, S.cp.name); S.form.goalTouched = false; render(); } },
  'drill-step'(t) { S.form.drillStep = parseInt(t.dataset.n, 10); render(); },
  agility(t) { const v = t.dataset.v; S.form.agilityFocus = S.form.agilityFocus === v ? '' : v; Array.from(t.parentElement.children).forEach(b => b.classList.toggle('on', b.dataset.v === S.form.agilityFocus)); },
  't-section'(t) { S.T.lesson = null; loadSection(t.dataset.v); },
  't-sport'(t) { S.T.sport = t.dataset.v; S.T.overview = null; render(); if (S.T.tab === 'overview') loadOverview(); },
  't-tab'(t) { S.T.tab = t.dataset.tab; S.T.viewing = null; render(); if (S.T.tab === 'overview' && !S.T.overview) loadOverview(); },
  't-back'() { S.T.tab = 'students'; S.T.viewing = null; render(); },
  't-lesson'(t) { S.T.lesson = parseInt(t.dataset.n, 10); render(); },
  't-cp'(t) { S.T.cpName = t.dataset.v; render(); },
  't-open-student'(t) { openStudentAsTeacher(t.dataset.student); },
  reg(t) { const student = t.dataset.student, n = parseInt(t.dataset.n, 10); const e = regEntry(student, S.T.lesson); setRegister(student, S.T.lesson, { participation: e && e.participation === n ? null : n }); render(); },
  'reg-all'(t) { const n = parseInt(t.dataset.n, 10); groupRoster().forEach(r => { const e = regEntry(r.student, S.T.lesson); if (!e || !e.participation) setRegister(r.student, S.T.lesson, { participation: n }); }); render(); },
  grade(t) { const student = t.dataset.student, code = t.dataset.code, n = parseInt(t.dataset.n, 10); const o = S.T.overview.find(x => x.student === student); const cur = o && o.final[code] && o.final[code].score; setGrade(student, code, { score: cur === n ? null : n }); render(); },
  'grade-comment'(t) { const student = t.dataset.student, code = t.dataset.code; const o = S.T.overview.find(x => x.student === student); const cur = (o && o.final[code] && o.final[code].comment) || ''; const v = window.prompt(`Comment for ${student} · ${code}`, cur); if (v === null) return; setGrade(student, code, { comment: v.trim() }); render(); },
  'ov-refresh'() { S.T.overview = null; render(); loadOverview(); },
  'print-mode'(t) { S.T.printMode = t.dataset.v; render(); },
  print() { window.print(); }
};
document.addEventListener('click', e => { const t = e.target.closest('[data-act]'); if (!t) return; if (t.tagName === 'A') e.preventDefault(); const fn = actions[t.dataset.act]; if (fn) fn(t, e); });
document.addEventListener('input', e => { const t = e.target; const k = t.dataset && t.dataset.in; if (!k) return; if (k === 'wentWell' || k === 'nextGoal') S.form[k] = t.value; if (k === 'goal') { S.form.goal = t.value; S.form.goalTouched = true; } });
document.addEventListener('change', e => {
  const t = e.target; const k = t.dataset && t.dataset.in; if (!k) return;
  if (k === 'reg-note') setRegister(t.dataset.student, S.T.lesson, { note: t.value.trim() });
  if (k === 'agility') setAgility(t.dataset.student, t.dataset.field, t.value);
  if (k === 'test') setTestScore(t.dataset.student, t.dataset.skill, t.value);
});

boot();
})();
</script>
